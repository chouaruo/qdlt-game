<!-- 风格：赛博朋克 Cyberpunk — 深黑底色 / 霓虹青粉 / 发光边框 / 等宽字体 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问道链途 — 赛博朋克风</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0e0;
    font-family: 'Courier New', 'Noto Sans SC', monospace;
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 16px;
  }
  .container {
    max-width: 480px; width: 100%;
  }

  /* 标题 */
  .header {
    text-align: center; padding: 24px 0 16px;
  }
  .header h1 {
    font-size: 32px; font-weight: 700;
    color: #00fff5;
    text-shadow: 0 0 10px #00fff5, 0 0 30px #00fff588, 0 0 60px #00fff544;
    letter-spacing: 8px;
  }
  .header .subtitle {
    font-size: 12px; color: #ff00ff; margin-top: 6px;
    text-shadow: 0 0 6px #ff00ff88;
    letter-spacing: 2px;
  }

  /* 卡片通用 */
  .card {
    background: #0d0d2b;
    border: 1px solid #00fff540;
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 16px;
    box-shadow: 0 0 12px #00fff520, inset 0 0 12px #00fff508;
  }

  /* 人物信息 */
  .char-info {
    display: flex; justify-content: space-between; align-items: center;
  }
  .char-name {
    font-size: 18px; font-weight: 700; color: #00fff5;
    text-shadow: 0 0 6px #00fff588;
  }
  .char-title {
    font-size: 12px; color: #888; margin-top: 2px;
  }
  .realm {
    font-size: 14px; color: #ff00ff;
    border: 1px solid #ff00ff60;
    border-radius: 4px; padding: 4px 10px;
    text-shadow: 0 0 4px #ff00ff88;
    box-shadow: 0 0 8px #ff00ff30;
  }

  /* 属性 */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-row { display: flex; align-items: center; gap: 8px; }
  .stat-label { font-size: 12px; color: #888; width: 36px; flex-shrink: 0; }
  .stat-bar-bg {
    flex: 1; height: 14px; background: #1a1a3a; border-radius: 3px;
    overflow: hidden; position: relative;
    border: 1px solid #00fff520;
  }
  .stat-bar {
    height: 100%; border-radius: 3px;
    transition: width 0.6s;
  }
  .stat-bar.money { background: linear-gradient(90deg, #00fff5, #00fff5cc); box-shadow: 0 0 6px #00fff580; }
  .stat-bar.mind  { background: linear-gradient(90deg, #ff00ff, #ff00ffcc); box-shadow: 0 0 6px #ff00ff80; width: 100% !important; }
  .stat-bar.know  { background: linear-gradient(90deg, #ffaa00, #ffaa00cc); box-shadow: 0 0 6px #ffaa0080; }
  .stat-bar.luck  { background: linear-gradient(90deg, #00ff41, #00ff41cc); box-shadow: 0 0 6px #00ff4180; }
  .stat-val {
    font-size: 12px; color: #00fff5; width: 30px; text-align: right;
    font-weight: 700;
    animation: flicker 2s infinite alternate;
  }
  @keyframes flicker {
    0%, 90% { opacity: 1; } 95% { opacity: 0.6; } 100% { opacity: 1; }
  }

  /* 词条 */
  .traits { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .trait {
    font-size: 12px; padding: 4px 10px; border-radius: 4px;
    border: 1px solid; background: #0d0d2b;
    text-shadow: 0 0 4px currentColor;
  }
  .trait.green  { color: #00ff41; border-color: #00ff4160; box-shadow: 0 0 6px #00ff4120; }
  .trait.purple { color: #bf7fff; border-color: #bf7fff60; box-shadow: 0 0 6px #bf7fff20; }
  .trait.blue   { color: #00aaff; border-color: #00aaff60; box-shadow: 0 0 6px #00aaff20; }

  /* 剧情 */
  .story {
    font-size: 14px; line-height: 1.8; color: #c0c0c0;
    text-shadow: 0 0 2px #00fff520;
  }

  /* 选项 */
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    display: block; width: 100%; padding: 14px 16px;
    background: linear-gradient(135deg, #00fff510, #ff00ff10);
    border: 1px solid #00fff560;
    border-radius: 6px; color: #00fff5;
    font-size: 14px; font-family: inherit;
    cursor: pointer;
    text-shadow: 0 0 4px #00fff544;
    transition: all 0.3s;
    text-align: left;
  }
  .choice-btn:hover {
    background: linear-gradient(135deg, #00fff530, #ff00ff20);
    border-color: #00fff5;
    box-shadow: 0 0 20px #00fff540, 0 0 40px #ff00ff20;
    text-shadow: 0 0 8px #00fff5;
  }
  .choice-btn span.idx {
    color: #ff00ff; margin-right: 8px;
    text-shadow: 0 0 4px #ff00ff88;
  }

  /* 底部 */
  .footer-row {
    display: flex; gap: 10px;
  }
  .footer-row .card { flex: 1; padding: 12px; text-align: center; }
  .footer-label { font-size: 11px; color: #666; margin-bottom: 4px; }
  .footer-val { font-size: 13px; color: #00fff5; text-shadow: 0 0 4px #00fff544; }

  /* 扫描线 */
  .container::after {
    content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px, #00fff504 2px, #00fff504 4px
    );
    pointer-events: none; z-index: 999;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>问道链途</h1>
    <div class="subtitle">CHAIN_PATH :: v0.1 // CYBERPUNK_MODE</div>
  </div>

  <div class="card">
    <div class="char-info">
      <div>
        <div class="char-name">散户李狗蛋</div>
        <div class="char-title">身份：散户</div>
      </div>
      <div class="realm">凡人 A0</div>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat-row">
        <span class="stat-label">本金</span>
        <div class="stat-bar-bg"><div class="stat-bar money" style="width:10%"></div></div>
        <span class="stat-val">10</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">心态</span>
        <div class="stat-bar-bg"><div class="stat-bar mind" style="width:100%"></div></div>
        <span class="stat-val">125</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">认知</span>
        <div class="stat-bar-bg"><div class="stat-bar know" style="width:38%"></div></div>
        <span class="stat-val">38</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">气运</span>
        <div class="stat-bar-bg"><div class="stat-bar luck" style="width:0%"></div></div>
        <span class="stat-val">0</span>
      </div>
    </div>
    <div style="margin-top:12px;">
      <div class="traits">
        <span class="trait green">套牢不卖</span>
        <span class="trait purple">链上侦探</span>
        <span class="trait blue">淡定</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="story">
      晚上11点，你躺在出租屋的床上，手机屏幕照亮了黑暗。币安App刚装好，K线图跳动得像心电图。朋友的微信还在闪烁：
    </div>
  </div>

  <div class="card">
    <div class="choices">
      <button class="choice-btn"><span class="idx">[A]</span>梭哈比特币，一夜暴富</button>
      <button class="choice-btn"><span class="idx">[B]</span>研究基本面，稳健建仓</button>
      <button class="choice-btn"><span class="idx">[C]</span>先充钱体验，小额试水</button>
    </div>
  </div>

  <div class="footer-row">
    <div class="card">
      <div class="footer-label">持仓记录</div>
      <div class="footer-val">空仓</div>
    </div>
    <div class="card">
      <div class="footer-label">株主日志</div>
      <div class="footer-val">▸ 进入市场</div>
    </div>
  </div>
</div>
</body>
</html>
